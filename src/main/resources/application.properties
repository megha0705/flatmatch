spring.application.name=flatmate-finder

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/flatmate
spring.datasource.username=postgres
spring.datasource.password=Megha05711@%

# JPA / Hibernate Configuration
# Use 'validate' so Hibernate checks that entities match the DB schema created by Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
