services:
  postgres:
    image: postgres:16-alpine
    container_name: flatmate-postgres
    restart: unless-stopped
    environment:
      # Values come from your local .env file (never committed).
      # The ":?" makes compose stop with a clear error if a value is missing.
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports:
      # Bound to localhost only, so other machines on your network can't reach it
      - "127.0.0.1:5432:5432"
    volumes:
      - flatmate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flatmate_pgdata: